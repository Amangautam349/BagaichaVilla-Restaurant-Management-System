<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagaicha Villa — Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#F6F3EA; --sand-deep:#EDE8D8; --forest:#2F4034; --forest-deep:#202C24;
    --sage:#8A9A5B; --brass:#C9A227; --ink:#1E241D; --line:#D8D2C0; --white:#FFFFFF; --error:#A3432F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Work Sans', sans-serif; background:var(--sand); color:var(--ink); }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--sand); padding-bottom:70px; }

  /* ---- Header ---- */
  .banner{
    height:96px; background:linear-gradient(135deg, var(--forest), var(--forest-deep));
    border-radius:0 0 16px 16px; position:relative;
  }
  .header-row{ display:flex; align-items:center; gap:8px; padding:16px 18px 0; color:var(--sand); }
  .header-row svg{ width:20px; height:20px; }
  .header-row span{ font-family:'Fraunces', serif; font-weight:500; font-size:1rem; }

  /* ---- Profile card ---- */
  .profile-card{
    margin:-40px 18px 0; background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:16px; display:flex; gap:14px; align-items:center; position:relative;
  }
  .avatar{
    width:66px; height:66px; border-radius:50%; background:linear-gradient(135deg, var(--sage), var(--forest));
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; position:relative; overflow:hidden;
    border:3px solid var(--white); box-shadow:0 0 0 1px var(--line);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar svg{ width:26px; height:26px; opacity:0.85; }
  .avatar input{ display:none; }
  .pinfo{ flex:1; min-width:0; }
  .pinfo .pname{ font-family:'Fraunces', serif; font-weight:500; font-size:1.1rem; }
  .pinfo .pbio{ font-size:0.8rem; color:#8b8672; margin-top:3px; line-height:1.4; }
  .editbtn{
    background:var(--sand); border:1px solid var(--line); border-radius:20px; padding:6px 12px;
    font-size:0.76rem; cursor:pointer; color:var(--forest); font-weight:500; flex:0 0 auto;
  }

  /* ---- Edit profile inline panel ---- */
  .edit-panel{
    margin:10px 18px 0; background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:16px; display:none;
  }
  .edit-panel.show{ display:block; }
  .edit-panel label{ display:block; font-size:0.78rem; font-weight:500; color:var(--forest); margin-bottom:5px; }
  .edit-panel input, .edit-panel textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:5px; background:var(--sand);
    font-family:'Work Sans', sans-serif; font-size:0.86rem; color:var(--ink); outline:none; margin-bottom:12px; resize:none;
  }
  .edit-panel .savebtn{ width:100%; padding:10px; background:var(--forest); color:var(--sand); border:none; border-radius:6px; font-weight:600; font-size:0.85rem; cursor:pointer; }

  /* ---- Compose box ---- */
  .compose{
    margin:16px 18px 0; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  .compose textarea{
    width:100%; border:none; resize:none; font-family:'Work Sans', sans-serif; font-size:0.9rem; color:var(--ink);
    outline:none; min-height:44px;
  }
  .compose-photo-preview{ display:none; margin-top:8px; position:relative; }
  .compose-photo-preview.show{ display:block; }
  .compose-photo-preview img{ width:100%; max-height:180px; object-fit:cover; border-radius:8px; }
  .compose-photo-preview button{
    position:absolute; top:6px; right:6px; background:rgba(32,44,36,0.7); color:var(--sand); border:none;
    border-radius:50%; width:24px; height:24px; cursor:pointer;
  }
  .compose-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; border-top:1px solid var(--sand-deep); padding-top:10px; }
  .photo-btn{ display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--forest); cursor:pointer; font-weight:500; }
  .photo-btn input{ display:none; }
  .postbtn{ background:var(--forest); color:var(--sand); border:none; padding:8px 18px; border-radius:20px; font-size:0.84rem; font-weight:600; cursor:pointer; }
  .postbtn:disabled{ background:var(--line); color:#9a927b; cursor:not-allowed; }

  /* ---- Feed ---- */
  .feed{ padding:18px 18px 0; }
  .post{ background:var(--white); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .post-head{ display:flex; align-items:center; gap:10px; padding:14px 14px 0; }
  .post-avatar{ width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, var(--sage), var(--forest)); flex:0 0 auto; }
  .post-who{ flex:1; }
  .post-who .pname{ font-weight:600; font-size:0.88rem; }
  .post-who .ptime{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:#9a927b; }
  .post-text{ padding:10px 14px 0; font-size:0.9rem; line-height:1.45; }
  .post-photo{ margin-top:10px; width:100%; max-height:260px; object-fit:cover; display:block; }
  .post-foot{ display:flex; align-items:center; gap:16px; padding:10px 14px; border-top:1px solid var(--sand-deep); margin-top:12px; }
  .cmt-toggle{ font-size:0.82rem; color:var(--forest); cursor:pointer; font-weight:500; }

  .comments{ display:none; padding:0 14px 12px; }
  .comments.show{ display:block; }
  .comment{ display:flex; gap:8px; padding:8px 0; border-top:1px solid var(--sand-deep); }
  .comment:first-child{ border-top:none; }
  .c-avatar{ width:26px; height:26px; border-radius:50%; background:var(--sage); flex:0 0 auto; }
  .c-body{ flex:1; }
  .c-name{ font-weight:600; font-size:0.8rem; }
  .c-text{ font-size:0.82rem; line-height:1.4; margin-top:1px; }
  .add-comment{ display:flex; gap:8px; margin-top:8px; align-items:center; }
  .add-comment input{
    flex:1; border:1px solid var(--line); border-radius:16px; padding:8px 13px; font-size:0.82rem;
    outline:none; background:var(--sand);
  }
  .add-comment button{ background:none; border:none; color:var(--forest); font-weight:600; font-size:0.82rem; cursor:pointer; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest-deep); color:var(--sand); padding:12px 20px; border-radius:6px;
    font-size:0.85rem; opacity:0; transition:all 0.25s ease; pointer-events:none; font-family:'IBM Plex Mono', monospace; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <div class="banner">
    <div class="header-row">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4C20 4 8 12 8 24C8 31 13 36 20 36C27 36 32 31 32 24C32 12 20 4 20 4Z" stroke="#C9A227" stroke-width="1.8"/>
        <path d="M20 36V16" stroke="#C9A227" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Bagaicha Villa — Community</span>
    </div>
  </div>

  <div class="profile-card">
    <div class="avatar" id="myAvatar">
      <img id="myAvatarImg" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" id="myAvatarIcon"><path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12Z" stroke="#F6F3EA" stroke-width="1.4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke="#F6F3EA" stroke-width="1.4"/></svg>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
    <div class="pinfo">
      <div class="pname" id="pname">Sujata Gurung</div>
      <div class="pbio" id="pbio">Loves the garden view table 🌿 · here for the trout</div>
    </div>
    <button class="editbtn" id="editProfileBtn">Edit</button>
  </div>

  <div class="edit-panel" id="editPanel">
    <label for="nameInput">Display name</label>
    <input id="nameInput" type="text">
    <label for="bioInput">Bio</label>
    <textarea id="bioInput" rows="2"></textarea>
    <button class="savebtn" id="saveProfileBtn">Save profile</button>
  </div>

  <div class="compose">
    <textarea id="composeText" placeholder="Share something with the Bagaicha community..."></textarea>
    <div class="compose-photo-preview" id="composePreview">
      <img id="composePreviewImg">
      <button id="removeComposePhoto">✕</button>
    </div>
    <div class="compose-actions">
      <label class="photo-btn">
        📷 Add photo
        <input type="file" id="composePhotoInput" accept="image/*">
      </label>
      <button class="postbtn" id="postBtn" disabled>Post</button>
    </div>
  </div>

  <div class="feed" id="feed"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  let profile = { name:'Sujata Gurung', bio:'Loves the garden view table 🌿 · here for the trout', avatar:null };

  let posts = [
    {
      id:1, name:'Ramesh K.', time:'2h ago',
      text:'The grilled trout tonight was unreal. Villa staff took such good care of us on our anniversary trip 🙏',
      photo:null,
      comments:[ { name:'Anita P.', text:'We\'re going next weekend, so glad to hear this!' } ]
    },
    {
      id:2, name:'Prakash S.', time:'1d ago',
      text:'Morning views from the garden table never get old. Perfect spot for chiya.',
      photo:null,
      comments:[]
    },
  ];
  let nextPostId = 3;
  let composePhoto = null;

  function initial(name){ return name.trim().charAt(0).toUpperCase(); }

  function renderProfile(){
    document.getElementById('pname').textContent = profile.name;
    document.getElementById('pbio').textContent = profile.bio;
    const img = document.getElementById('myAvatarImg');
    const icon = document.getElementById('myAvatarIcon');
    if(profile.avatar){
      img.src = profile.avatar; img.style.display = 'block'; icon.style.display = 'none';
    } else {
      img.style.display = 'none'; icon.style.display = 'block';
    }
  }

  document.getElementById('myAvatar').addEventListener('click', () => document.getElementById('avatarInput').click());
  document.getElementById('avatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { profile.avatar = ev.target.result; renderProfile(); };
    reader.readAsDataURL(file);
  });

  document.getElementById('editProfileBtn').addEventListener('click', () => {
    const panel = document.getElementById('editPanel');
    document.getElementById('nameInput').value = profile.name;
    document.getElementById('bioInput').value = profile.bio;
    panel.classList.toggle('show');
  });

  document.getElementById('saveProfileBtn').addEventListener('click', () => {
    const n = document.getElementById('nameInput').value.trim();
    const b = document.getElementById('bioInput').value.trim();
    if(n) profile.name = n;
    profile.bio = b;
    renderProfile();
    document.getElementById('editPanel').classList.remove('show');
    showToast('Profile updated.');
  });

  const composeText = document.getElementById('composeText');
  const postBtn = document.getElementById('postBtn');
  composeText.addEventListener('input', updatePostBtn);
  function updatePostBtn(){
    postBtn.disabled = composeText.value.trim().length === 0 && !composePhoto;
  }

  document.getElementById('composePhotoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      composePhoto = ev.target.result;
      document.getElementById('composePreviewImg').src = composePhoto;
      document.getElementById('composePreview').classList.add('show');
      updatePostBtn();
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('removeComposePhoto').addEventListener('click', () => {
    composePhoto = null;
    document.getElementById('composePreview').classList.remove('show');
    updatePostBtn();
  });

  postBtn.addEventListener('click', () => {
    const text = composeText.value.trim();
    if(!text && !composePhoto) return;
    posts.unshift({ id:nextPostId++, name:profile.name, time:'Just now', text, photo:composePhoto, comments:[] });
    composeText.value = '';
    composePhoto = null;
    document.getElementById('composePreview').classList.remove('show');
    updatePostBtn();
    renderFeed();
    showToast('Posted to the community feed.');
  });

  function renderFeed(){
    const wrap = document.getElementById('feed');
    wrap.innerHTML = '';
    posts.forEach(p => {
      const el = document.createElement('div');
      el.className = 'post';
      el.innerHTML = `
        <div class="post-head">
          <div class="post-avatar"></div>
          <div class="post-who">
            <div class="pname">${p.name}</div>
            <div class="ptime">${p.time}</div>
          </div>
        </div>
        <div class="post-text">${p.text}</div>
        ${p.photo ? `<img class="post-photo" src="${p.photo}">` : ''}
        <div class="post-foot">
          <div class="cmt-toggle" data-id="${p.id}">${p.comments.length} comment${p.comments.length === 1 ? '' : 's'}</div>
        </div>
        <div class="comments" id="comments-${p.id}">
          ${p.comments.map(c => `
            <div class="comment">
              <div class="c-avatar"></div>
              <div class="c-body"><div class="c-name">${c.name}</div><div class="c-text">${c.text}</div></div>
            </div>
          `).join('')}
          <div class="add-comment">
            <input type="text" placeholder="Write a comment..." data-cinput="${p.id}">
            <button data-csend="${p.id}">Send</button>
          </div>
        </div>
      `;
      wrap.appendChild(el);
    });

    wrap.querySelectorAll('.cmt-toggle').forEach(t => {
      t.addEventListener('click', () => {
        document.getElementById('comments-' + t.dataset.id).classList.toggle('show');
      });
    });
    wrap.querySelectorAll('[data-csend]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.csend);
        const input = wrap.querySelector(`[data-cinput="${id}"]`);
        const val = input.value.trim();
        if(!val) return;
        const post = posts.find(p => p.id === id);
        post.comments.push({ name:profile.name, text:val });
        renderFeed();
        document.getElementById('comments-' + id).classList.add('show');
      });
    });
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  renderProfile();
  renderFeed();
</script>

</body>
</html>
